<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ประวัติ</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main><h1>ประวัติการยืม-คืน</h1><div class="wrap" id="t">กำลังโหลด...</div></main>
<script src="app.js"></script><script>
const m=guard('user');nav('History.html');const ST={pending:'รออนุมัติ',borrowed:'กำลังยืม',returned:'คืนแล้ว',rejected:'ไม่อนุมัติ'};
load('loans',[]).then(({d})=>{const r=d.filter(l=>l.uid==m.id).reverse();
$('#t').innerHTML=`<table><tr><th>เลขที่</th><th>รายการ</th><th>วันที่ยืม</th><th>กำหนดคืน</th><th>วันที่คืน</th><th>สถานะ</th></tr>${r.map(l=>`<tr><td>${l.no}</td><td>${esc(l.item)}</td><td>${th(l.borrowDate)}</td><td>${th(l.due)}</td><td>${th(l.retDate)}</td><td><span class="tag ${l.status=='returned'?'ok':''}">${ST[l.status]}</span></td></tr>`).join('')||'<tr><td colspan=6>ยังไม่มีประวัติ</td></tr>'}</table>`}).catch(e=>$('#t').textContent=e.message);
</script></body></html>
