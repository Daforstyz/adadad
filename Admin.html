<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการระบบ</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main>
<div class="tabs noprint"><button class="btn" onclick="show('req')">คำขอ</button><button class="btn g" onclick="show('items')">จัดการรายการ</button><button class="btn g" onclick="show('users')">ผู้ใช้</button><button class="btn g" onclick="show('rep')">รายงาน PDF</button></div><div id="v"></div></main>
<script src="app.js"></script><script>
guard('admin');nav('Admin.html');let loans=[],books=[],users={};
const ST={pending:'รออนุมัติ',borrowed:'กำลังยืม',returned:'คืนแล้ว',rejected:'ไม่อนุมัติ'};
async function ref(){[loans,books,users]=(await Promise.all([load('loans',[]),load('books',[]),load('users',{})])).map(x=>x.d)}
async function show(t){try{await ref();window[t+'V']()}catch(e){$('#v').textContent=e.message}}
function reqV(){$('#v').innerHTML=`<div class="wrap"><table><tr><th>เลขที่</th><th>ผู้ยืม</th><th>รายการ</th><th>ยืม</th><th>กำหนดคืน</th><th>สถานะ</th><th></th></tr>${loans.slice().reverse().map(l=>`<tr><td>${l.no}</td><td>${esc(l.name)}<br>${l.level}</td><td>${esc(l.item)}</td><td>${th(l.borrowDate)}</td><td>${th(l.due)}</td><td><span class="tag">${ST[l.status]}</span></td><td>${l.status=='pending'?`<button class="btn" onclick="setL('${l.no}','borrowed')">${ic('check')}อนุมัติ</button> <button class="btn g" onclick="setL('${l.no}','rejected')">ปฏิเสธ</button>`:l.status=='borrowed'?`<button class="btn" onclick="setL('${l.no}','returned')">${ic('check')}รับคืน</button>`:''}</td></tr>`).join('')}</table></div>`}
async function setL(no,st){let x;try{await upd('loans',[],d=>{x=d.find(y=>y.no==no);x.status=st;if(st=='returned'){x.retDate=today();x.retNo='R'+no.slice(1)}});
const e=(users[x.uid]||{}).email,b={'เลขที่การยืม':x.no,'ชื่อผู้ยืม':x.name,'ระดับชั้น':x.level,'กลุ่มเรียน':x.group,'แผนกวิชา':x.dept,'สาขาวิชา':x.major};
if(st=='borrowed')mail(e,'อนุมัติการยืม',{...b,'รายละเอียดที่ยืม':x.item,'วันที่ยืม':th(x.borrowDate),'วันที่คืน':th(x.due)});
if(st=='returned')mail(e,'การคืนสำเร็จ',{'เรื่อง':'การคืน','เลขที่การคืน':x.retNo,'เลขอ้างอิงการยืม':x.no,...b,'วันที่ยืม':th(x.borrowDate),'วันที่ต้องคืน':th(x.due),'วันที่คืนสำเร็จ':th(x.retDate)});
show('req')}catch(e){alert(e.message)}}
function itemsV(){$('#v').innerHTML=`<form class="row card" id="af"><div><label>ชื่อ</label><input id="n" required></div><div><label>ประเภท</label><input id="ty"></div><div><label>จำนวน</label><input id="q" type="number" min="1" value="1"></div><button class="btn">${ic('plus')}เพิ่ม</button></form><br><div class="wrap"><table><tr><th>ชื่อ</th><th>ประเภท</th><th>จำนวน</th><th></th></tr>${books.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.type)}</td><td>${b.qty}</td><td><button class="btn g" onclick="edB('${b.id}')">${ic('edit')}แก้ไข</button> <button class="btn g" onclick="rmB('${b.id}')">${ic('trash')}ลบ</button></td></tr>`).join('')}</table></div>`;
$('#af').onsubmit=async e=>{e.preventDefault();await upd('books',[],d=>{d.push({id:'B'+Date.now(),title:$('#n').value,type:$('#ty').value,qty:+$('#q').value})});show('items')}}
async function edB(id){const b=books.find(x=>x.id==id),t=prompt('ชื่อ',b.title);if(t===null)return;const q=prompt('จำนวน',b.qty);await upd('books',[],d=>{const x=d.find(y=>y.id==id);x.title=t;x.qty=+q||x.qty});show('items')}
async function rmB(id){if(confirm('ลบรายการนี้?')){await upd('books',[],d=>d.filter(y=>y.id!=id));show('items')}}
function usersV(){const U=Object.entries(users);$('#v').innerHTML=`<div class="wrap"><table><tr><th>รหัสนักศึกษา</th><th>ชื่อ</th><th>ระดับ</th><th>แผนก</th><th>อีเมล</th><th></th></tr>${U.map(([k,u])=>`<tr><td>${k}</td><td>${esc(u.first+' '+u.last)}</td><td>${u.level}</td><td>${esc(u.dept)}</td><td>${esc(u.email)}</td><td><button class="btn g" onclick="rmU('${k}')">${ic('trash')}ลบ</button></td></tr>`).join('')||'<tr><td colspan=6>ยังไม่มีผู้ใช้</td></tr>'}</table></div>`}
async function rmU(k){if(confirm('ลบผู้ใช้นี้? ประวัติการยืมจะยังอยู่')){await upd('users',{},u=>{delete u[k]});show('users')}}
function repV(){$('#v').innerHTML=`<div class="row noprint card"><div><label>รายงานแบบ</label><select id="m"><option value="10">รายวัน</option><option value="7">รายเดือน</option><option value="4">รายปี</option></select></div><div><label>วันที่อ้างอิง</label><input type="date" id="d" value="${today()}"></div><button class="btn" onclick="rep()">${ic('file')}สร้างรายงาน</button><button class="btn g" onclick="print()">บันทึกเป็น PDF</button></div><div id="r"></div>`;rep()}
function rep(){const n=+$('#m').value,k=$('#d').value.slice(0,n),B=loans.filter(l=>l.borrowDate.startsWith(k)&&['borrowed','returned'].includes(l.status)),R=loans.filter(l=>(l.retDate||'').startsWith(k));
const C=['no','name','level','group','dept','major'],h='<th>เลขที่การยืม</th><th>ชื่อผู้ยืม</th><th>ระดับชั้น</th><th>กลุ่มเรียน</th><th>แผนก</th><th>สาขา</th>';
$('#r').innerHTML=`<h1>รายงานการยืม (${th($('#d').value)})</h1><table><tr>${h}<th>รายละเอียดที่ยืม</th><th>วันที่ยืม</th></tr>${B.map(l=>`<tr>${C.map(c=>`<td>${esc(l[c])}</td>`).join('')}<td>${esc(l.item)}</td><td>${th(l.borrowDate)}</td></tr>`).join('')}</table><h1 style="margin-top:20px">รายงานการคืน</h1><table><tr><th>เลขที่การคืน</th><th>อ้างอิงการยืม</th>${h.replace('<th>เลขที่การยืม</th>','')}<th>วันที่ยืม</th><th>วันที่ต้องคืน</th><th>วันที่คืนสำเร็จ</th></tr>${R.map(l=>`<tr><td>${l.retNo}</td><td>${l.no}</td>${C.slice(1).map(c=>`<td>${esc(l[c])}</td>`).join('')}<td>${th(l.borrowDate)}</td><td>${th(l.due)}</td><td>${th(l.retDate)}</td></tr>`).join('')}</table>`}
show('req');
</script></body></html>
