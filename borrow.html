<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12060a"><title>ยืม-คืน</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main>
<section class="hero two"><div><small>ยินดีต้อนรับ</small><h1 id="hi"></h1><div class="pills" id="st"></div><div class="due"><input type="date" id="due" aria-label="วันที่ต้องการคืน"><span id="dueTh"></span></div></div>
<div class="b3w"><div class="b3"><i class="f">ห้องสมุด<br>วท.พัทลุง</i><i class="k"></i><i class="s"></i><i class="p"></i></div></div></section>
<div class="bar2"><input id="q" type="search" placeholder="ค้นหาชื่อรายการ"><div id="chips" class="tabs" style="margin:0"></div></div>
<div class="grid" id="g"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div></main>
<script src="app.js"></script><script>
const m=guard('user');nav('borrow.html');$('#hi').textContent=m.name;
const d=new Date();d.setDate(d.getDate()+7);$('#due').value=d.toISOString().slice(0,10);$('#due').min=today();
const showDue=()=>$('#dueTh').textContent='คืนวันที่ '+th($('#due').value);$('#due').onchange=showDue;showDue();
let items=[],loans=[],cat='ทั้งหมด',q='';const pal=['#7a1626','#b3122d','#5a0f1b','#9b1c31','#44121c'],hs=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%5;
const left=i=>i.qty-loans.filter(l=>l.itemId==i.id&&['pending','borrowed'].includes(l.status)).length;
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)};
function draw(first){const mine=loans.filter(l=>l.uid==m.id),n=s=>mine.filter(l=>l.status==s).length;
$('#st').innerHTML=`<span class="pill">กำลังยืม <b class="n" data-n="${n('borrowed')}">0</b></span><span class="pill">รออนุมัติ <b class="n" data-n="${n('pending')}">0</b></span>`;
document.querySelectorAll('.n').forEach(e=>countUp(e,+e.dataset.n));
const cats=['ทั้งหมด',...new Set(items.map(i=>i.type).filter(Boolean))];
$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});
const L=items.filter(i=>(cat=='ทั้งหมด'||i.type==cat)&&i.title.toLowerCase().includes(q));
$('#g').innerHTML=L.map((i,k)=>{const l=left(i),p=Math.max(0,Math.round(l/i.qty*100));
return `<article class="card it" data-tilt style="--d:${k*60}ms"><div class="cv" style="--c:${pal[hs(i.title)]}"><b>${esc(i.title)}</b><small>${esc(i.type||'ทั่วไป')}</small></div><div class="bar"><i style="width:${p}%"></i></div><div class="meta">เหลือ ${l} จาก ${i.qty}</div><button class="btn full" ${l<1?'disabled':''} onclick="req('${i.id}',this)">${ic('plus')}${l<1?'หมดชั่วคราว':'ขอยืม'}</button></article>`}).join('')||'<p class="mut">ไม่พบรายการ</p>'}
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
async function init(){[items,loans]=(await Promise.all([load('books',[]),load('loans',[])])).map(x=>x.d);draw()}
async function req(id,b){const i=items.find(x=>x.id==id);b.disabled=true;
try{const u=(await load('users',{})).d[m.id];await upd('loans',[],d=>{d.push({no:'L'+String(d.length+1).padStart(4,'0'),uid:m.id,name:u.first+' '+u.last,level:u.level,group:u.group,dept:u.dept,major:u.major,item:i.title,itemId:i.id,borrowDate:today(),due:$('#due').value,status:'pending'})});
flyBook(b,document.querySelector('.top a[href="History.html"]'));toast('ส่งคำขอแล้ว รอแอดมินอนุมัติ');await init()}catch(e){toast(e.message);b.disabled=false}}
init().catch(e=>$('#g').textContent=e.message);
</script></body></html>
